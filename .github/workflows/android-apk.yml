name: Android APK

# Capacitor APK 빌드 (04 T2-9). 설치와 서명 키 등록은 docs/android.md
# - Secrets BLUECARD_KEYSTORE_BASE64·BLUECARD_KEYSTORE_PASSWORD가 있으면 출시 키로 서명한 release APK
# - 없으면 debug APK (빌드마다 다른 임시 키라 업데이트 설치가 안 됨)
# - v* 태그이고 출시 키로 서명했으면 GitHub Release에 APK를 붙임
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.BLUECARD_KEYSTORE_BASE64 != '' && secrets.BLUECARD_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: 웹 빌드 + Capacitor 동기화
        run: npm run cap:sync

      - name: 출시 서명 키 복원
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.BLUECARD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/bluecard-release.p12"
          echo "BLUECARD_KEYSTORE_FILE=$RUNNER_TEMP/bluecard-release.p12" >> "$GITHUB_ENV"
          echo "BLUECARD_KEY_ALIAS=bluecard" >> "$GITHUB_ENV"

      - name: 경고 - 서명 키 없음 (debug APK)
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning title=서명 키 없음::debug APK를 만듭니다. 빌드마다 다른 임시 키라 업데이트 설치가 안 됩니다. docs/android.md의 '서명 키 등록'을 하세요."

      - name: APK 빌드
        working-directory: android
        env:
          BLUECARD_KEYSTORE_PASSWORD: ${{ secrets.BLUECARD_KEYSTORE_PASSWORD }}
          BLUECARD_VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          export BLUECARD_VERSION_NAME="$VERSION"
          chmod +x gradlew
          if [ "$HAS_SIGNING_KEY" = "true" ]; then TASK=assembleRelease; KIND=release; else TASK=assembleDebug; KIND=debug; fi
          ./gradlew --no-daemon "$TASK"
          SRC=$(ls app/build/outputs/apk/$KIND/*.apk | head -n1)
          if [ "$KIND" = "release" ]; then NAME="blue-card-v$VERSION.apk"; else NAME="blue-card-v$VERSION-DEBUG.apk"; fi
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$SRC" "$GITHUB_WORKSPACE/apk-out/$NAME"
          # 늘 같은 이름: releases/latest/download/blue-card.apk 로 받을 수 있게
          if [ "$KIND" = "release" ]; then cp "$SRC" "$GITHUB_WORKSPACE/apk-out/blue-card.apk"; fi
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "### Android APK"
            echo ""
            echo "- 파일: \`$NAME\` (버전 $VERSION, $KIND)"
            echo "- SHA256: \`$(sha256sum "$GITHUB_WORKSPACE/apk-out/$NAME" | cut -d' ' -f1)\`"
            if [ "$KIND" = "debug" ]; then echo "- 서명 키 없음: 업데이트 설치가 안 되는 debug APK (docs/android.md)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 서명 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/bluecard-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: blue-card-apk-${{ env.APK_VERSION }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release에 붙이기 (서명한 태그 빌드)
        if: env.HAS_SIGNING_KEY == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "apk-out/$APK_NAME" apk-out/blue-card.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" "apk-out/$APK_NAME" apk-out/blue-card.apk --latest --title "블루 카드 $GITHUB_REF_NAME (Android)" --notes "휴대폰에서 blue-card.apk를 받아 설치하세요. 자세한 방법: docs/android.md"
          fi
